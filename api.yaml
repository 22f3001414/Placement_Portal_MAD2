openapi: 3.0.0

info:
  title: Placement Portal API
  description: >
    REST API documentation for the multi-role campus placement system
    built with Flask, Vue.js, Redis, and Celery.
  version: 1.1.0

servers:
  - url: http://localhost:5000/api
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:

  ############################################
  # Authentication
  ############################################

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: admin@ppa.com

                password:
                  type: string
                  example: admin123

      responses:
        "200":
          description: Successful Login

        "401":
          description: Invalid Credentials

        "403":
          description: Account Blacklisted or Deactivated

  /auth/register/student:
    post:
      tags:
        - Authentication
      summary: Register Student
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                email:
                  type: string

                password:
                  type: string

                name:
                  type: string

                branch:
                  type: string

                cgpa:
                  type: number
                  format: float

                year:
                  type: integer

      responses:
        "201":
          description: Student Registered Successfully

  /auth/register/company:
    post:
      tags:
        - Authentication
      summary: Register Company
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:

                email:
                  type: string

                password:
                  type: string

                company_name:
                  type: string

                hr_contact:
                  type: string

                website:
                  type: string

      responses:
        "201":
          description: Company Registered Successfully

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout Current User

      responses:
        "200":
          description: Logged Out Successfully

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User Details

      responses:
        "200":
          description: User Profile Returned